# This is a basic workflow to help you get started with Actions

name: CI

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "main" branch
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
    # "labeled" is the extra one — it makes the workflow re-run when you
    # add a label to the PR. That is how the approve step reaches us.
    types: [ opened, synchronize, reopened, labeled ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Read-only by default. The merge job asks for more, on its own.
permissions:
  contents: read

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # Job 1 — the checks. Runs on every push and every PR.
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v4

      - name: Say hello
        run: echo Hello Ali, the pipeline works

      - name: List what is in the repo
        run: ls -la

  # Job 2 — the merge. Only runs when BOTH are true:
  #   1. this is a pull request, and it carries the label "approved"
  #   2. the build job above finished green  (that is what "needs" means)
  merge:
    needs: build
    if: >
      github.event_name == 'pull_request' &&
      contains(github.event.pull_request.labels.*.name, 'approved')
    runs-on: ubuntu-latest
    permissions:
      contents: write        # needed to write to main
      pull-requests: write   # needed to merge the PR
    steps:
      - name: Merge this PR into main
        # gh is preinstalled on the runner. github.token is provided
        # automatically — there is no secret for you to set up.
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          gh pr merge "$PR" --merge --delete-branch --repo "$GITHUB_REPOSITORY"
          echo "::notice::PR #$PR merged into main"
