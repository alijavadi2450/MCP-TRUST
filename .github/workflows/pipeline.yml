name: pipeline

# One pipeline, three jobs:
#   normal push        -> keep a snapshot of the work
#   push a tag (v*)    -> cut a GitHub Release
#   click Run workflow -> merge a branch into main (manual, on purpose)

on:
  push:
    branches: ['**']
    tags: ['v*']

  # This is what gives you the "Run workflow" button in the Actions tab.
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to merge FROM (e.g. my-changes)'
        required: true
        type: string
      target:
        description: 'Branch to merge INTO'
        required: true
        default: main
        type: string

# Least privilege: read by default, write only where a job needs it.
permissions:
  contents: read

jobs:
  keep:
    # Branch pushes only. Not tags, not the manual button.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      # Downloadable snapshot of this exact push — whole repo, minus git internals.
      - uses: actions/upload-artifact@v4
        with:
          name: snapshot-${{ github.sha }}
          path: |
            .
            !.git
          retention-days: 90

  release:
    # Tag pushes only, e.g. v0.5.0.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # gh is preinstalled on the runner. No third-party action, no secret
      # to manage — github.token is provided automatically.
      - name: Cut the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes

  merge:
    # Manual button only. Never fires on a push.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # fetch-depth: 0 pulls full history — a merge needs it.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Merge branch into target
        # Inputs go in via env, never straight into the script. A branch name
        # containing shell characters would otherwise run as code.
        env:
          FROM: ${{ inputs.branch }}
          INTO: ${{ inputs.target }}
        run: |
          set -e
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Fail early with a clear message if the branch is not there.
          git rev-parse --verify "origin/$FROM" >/dev/null 2>&1 \
            || { echo "::error::branch '$FROM' does not exist on the remote"; exit 1; }

          if [ "$FROM" = "$INTO" ]; then
            echo "::error::cannot merge '$FROM' into itself"; exit 1
          fi

          git checkout "$INTO"
          # --no-ff always writes a merge commit, so the history shows what happened.
          git merge --no-ff "origin/$FROM" -m "merge $FROM into $INTO"
          git push origin "$INTO"
          echo "::notice::merged $FROM into $INTO"
